name: Build Feez iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Find Flutter project
        id: find_project
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -1 | xargs dirname)
          echo "dir=$FLUTTER_DIR" >> $GITHUB_OUTPUT
          echo "Flutter project: $FLUTTER_DIR"

      - name: Get dependencies
        run: |
          cd ${{ steps.find_project.outputs.dir }}
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd ${{ steps.find_project.outputs.dir }}/ios
          pod install --repo-update

      - name: Build iOS release
        run: |
          cd ${{ steps.find_project.outputs.dir }}
          flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd ${{ steps.find_project.outputs.dir }}
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r Feez.ipa Payload/
          echo "IPA: $(du -sh Feez.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feez-iOS-${{ github.run_number }}
          path: "**/Feez.ipa"
          retention-days: 7