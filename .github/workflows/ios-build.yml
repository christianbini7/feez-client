name: Build Feez iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Check project structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== Looking for pubspec.yaml ==="
          find . -name "pubspec.yaml" -not -path "*/.*"

      - name: Get dependencies
        run: |
          # Trouve automatiquement le dossier Flutter
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -1 | xargs dirname)
          echo "Flutter project found at: $FLUTTER_DIR"
          cd $FLUTTER_DIR
          flutter pub get

      - name: Build iOS release
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -1 | xargs dirname)
          cd $FLUTTER_DIR
          flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -1 | xargs dirname)
          cd $FLUTTER_DIR
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r Feez.ipa Payload/
          echo "IPA size: $(du -sh Feez.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feez-iOS-${{ github.run_number }}
          path: |
            **/Feez.ipa
          retention-days: 7