name: Build Feez iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ─────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Flutter ───────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # ── 3. Dépendances ───────────────────────────
      - name: Get dependencies
        run: flutter pub get

      # ── 4. Build iOS (sans signature) ────────────
      - name: Build iOS release
        run: |
          flutter build ios --release --no-codesign

      # ── 5. Créer le dossier Payload ───────────────
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r Feez.ipa Payload/
          echo "IPA créé : $(du -sh Feez.ipa)"

      # ── 6. Upload artifact ────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feez-iOS-${{ github.run_number }}
          path: Feez.ipa
          retention-days: 7