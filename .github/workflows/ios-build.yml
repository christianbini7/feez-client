name: Build Feez iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Find Flutter dir
        id: proj
        run: |
          DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Found: $DIR"

      - name: Flutter pub get
        run: |
          cd ${{ steps.proj.outputs.dir }}
          flutter pub get

      - name: Build iOS (flutter handles pods)
        run: |
          cd ${{ steps.proj.outputs.dir }}
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd ${{ steps.proj.outputs.dir }}
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Feez.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feez-iOS-${{ github.run_number }}
          path: "**/Feez.ipa"
          retention-days: 7